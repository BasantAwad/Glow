# Render blueprint — Glow API (free tier).
#
# After pushing this repo to GitHub, go to render.com -> New -> Blueprint
# and point it at this file. The API service builds from
# apps/api/Dockerfile. Secrets below with `sync: false` must be pasted in
# the Render dashboard (never commit real values).
services:
  - type: web
    name: glow-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # The Dockerfile COPY paths are repo-root-relative.
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GLOW_ENVIRONMENT
        value: production
      - key: GLOW_DATABASE_URL
        sync: false  # Neon/Supabase Postgres URL (secret)
      - key: GLOW_MASTER_KEY
        generateValue: true  # real key generated by Render; or paste the existing one
      - key: GLOW_AUTH_SECRET_KEY
        generateValue: true
      - key: GLOW_LLM_PROVIDER
        value: openai_compatible
      - key: GLOW_LLM_API_BASE
        value: https://openrouter.ai/api/v1
      - key: GLOW_LLM_API_KEY
        sync: false  # secret
      - key: GLOW_LLM_MODEL_ID
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      - key: GLOW_LLM_TIMEOUT_SEC
        value: "30"
      - key: GLOW_LLM_FALLBACK_PROVIDER
        value: local
      - key: GLOW_LLM_LOCAL_FALLBACK_ENABLED
        value: "true"
      - key: GLOW_CORS_ORIGINS
        sync: false  # your Vercel web domain, e.g. https://your-app.vercel.app
      - key: GLOW_AUTH_COOKIE_SAMESITE
        value: none
      - key: GLOW_AUTH_COOKIE_SECURE
        value: "true"
