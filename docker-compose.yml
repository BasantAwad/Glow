version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: glow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GLOW_ENVIRONMENT: production
      GLOW_DATABASE_URL: sqlite+aiosqlite:///./glow.db
      # IMPORTANT: Change these before production deployment
      GLOW_AUTH_SECRET_KEY: ${GLOW_AUTH_SECRET_KEY:-change-me-in-production}
      GLOW_MASTER_KEY: ${GLOW_MASTER_KEY:-}
      GLOW_LLM_API_BASE: ${GLOW_LLM_API_BASE:-}
      GLOW_LLM_MODEL_ID: ${GLOW_LLM_MODEL_ID:-Qwen/Qwen2.5-14B-Instruct}
      # TTS
      GLOW_TTS_MODEL_PATH: ${GLOW_TTS_MODEL_PATH:-}
      GLOW_TTS_VOICE_ID: ${GLOW_TTS_VOICE_ID:-a}
      # STT
      GLOW_STT_MODEL_ID: ${GLOW_STT_MODEL_ID:-tiny}
    volumes:
      - glow-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  glow-data:
