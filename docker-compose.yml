version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: glow-postgres
    environment:
      POSTGRES_USER: glow_user
      POSTGRES_PASSWORD: glow_password
      POSTGRES_DB: glow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glow_user -d glow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
